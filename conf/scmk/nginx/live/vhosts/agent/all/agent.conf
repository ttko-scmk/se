# 1. 在 http 區塊或 location 外層用 map 處理手機判定與路徑，避免 Nginx If 陷阱
map $http_user_agent $agent_doc_root {
    default "/data/agent";
    ~*"(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge|maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino" "/data/agphone";
}

map $http_user_agent $agent_device_type {
    default "PC";
    ~*"(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge|maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino" "Mobile";
}

server {
    listen 80;

    # 2. 合併多個 -ap 正則與特定域名
    server_name ~^(?<subdomain>.+)-[1-5]ap\.(?<tld>.+)$;
    server_name ~^(?<subdomain>.+?-[1-5]ap-[^\.]+)\.(?<tld>.+)$;
    server_name kklo-agent-qa.gogo-lucky.com;

    index index.html;
    access_log /var/log/nginx/web_access.log main buffer=192k flush=30s;
    error_log /var/log/nginx/web_error.log;

    ## Root Location
    location / {
        # 動態帶入 map 判斷出來的根目錄 (/data/agent 或 /data/agphone)
        root $agent_doc_root;
        add_header Device $agent_device_type;

        # 標準且安全的 SPA 路由切換（徹底解決 500 死循環）
        try_files $uri $uri/ /index.html;
    }
}
