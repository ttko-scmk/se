# 1. 使用 map 在外層優化手機判定（效能極佳，且避免 Nginx if 陷阱）
map $http_user_agent $doc_root {
    default "/data/menber";
    ~*"(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge|maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino" "/data/mphone";
}

map $http_user_agent $device_type {
    default "PC";
    ~*"(android|bb\d+|meego).+mobile|avantgo|bada\/|blackberry|blazer|compal|elaine|fennec|hiptop|iemobile|ip(hone|od)|iris|kindle|lge|maemo|midp|mmp|mobile.+firefox|netfront|opera m(ob|in)i|palm( os)?|phone|p(ixi|re)\/|plucker|pocket|psp|series(4|6)0|symbian|treo|up\.(browser|link)|vodafone|wap|windows ce|xda|xiino" "Mobile";
}

server {
    listen 80;

    # 2. 修正 server_name：加入 agent/menber 以及 -qa 的通用匹配
    server_name ~^(?<subdomain>.+)-(1mp|2mp|3mp|4mp|5mp|qa|1ap)\.(?<tld>.+)$;
    server_name ~^(?<subdomain>.+?-[1-5]mp-[^\.]+)\.(?<tld>.+)$;
    server_name kklo-menber-qa.gogo-lucky.com kklo-agent-qa.gogo-lucky.com;

    index index.html;
    access_log /var/log/nginx/web_access.log main buffer=192k flush=30s;
    error_log /var/log/nginx/web_error.log;

    ## Root Location
    location / {
        # 動態帶入 map 算出來的根目錄 (/data/menber 或 /data/mphone)
        root $doc_root;
        add_header Device $device_type;

        # 單一且標準的 SPA 路由重寫（移除多餘的 if (!-e) 與混亂的 rewrite）
        try_files $uri $uri/ /index.html;
    }
}
